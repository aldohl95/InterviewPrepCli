[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewprep-cli"
version = "0.1.0"
description = "A CLI tool for organizing technical interview preparation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = ["platformdirs"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black >= 24.0",
    "ruff >= 0.4",
]

[project.scripts]
interviewprep = "interviewprep.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.ruff]
line-length = 88
target-version="py311"

[tool.ruff.lint]
select = ["E", "F", "W"]