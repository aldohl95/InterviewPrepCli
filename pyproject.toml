[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewprep-cli"
version = "0.1.0"
description = "A CLI tool for organizing technical interview preparation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Tevita Mathias", email = "mathias.tevita@icloud.com" }
]
keywords = ["cli", "leetcode", "interview-prep", "spaced-repetition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]


dependencies = ["platformdirs", "click", "rich"]
[project.urls]
Homepage = "https://github.com/aldohl95/InterviewPrepCli"
Repository = "https://github.com/aldohl95/InterviewPrepCli"
Issues = "https://github.com/aldohl95/InterviewPrepCli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black >= 24.0",
    "ruff >= 0.4",
]

[project.scripts]
interviewprep = "interviewprep.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.ruff]
line-length = 88
target-version="py311"

[tool.ruff.lint]
select = ["E", "F", "W"]